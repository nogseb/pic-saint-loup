name: Publier Pic Saint-Loup sur OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-pic-saint-loup
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche main
        uses: actions/checkout@v4

      - name: Vérifier la présence des secrets SFTP
        id: secrets
        shell: bash
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          if [[ -z "$OVH_SFTP_HOST" || -z "$OVH_SFTP_USER" || -z "$OVH_SFTP_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Déploiement ignoré : renseigner OVH_SFTP_HOST, OVH_SFTP_USER et OVH_SFTP_PASSWORD."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer lftp
        if: steps.secrets.outputs.configured == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Valider la destination isolée
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_DIR="$(realpath "$GITHUB_WORKSPACE/www/pic-saint-loup")"
          [[ "$PUBLISH_DIR" == "$GITHUB_WORKSPACE/www/pic-saint-loup" ]]
          test -f "$PUBLISH_DIR/index.html"
          test -f "$PUBLISH_DIR/.htaccess"
          # Garde explicite : ni www/ ni www/ds ni un autre sous-projet.
          REMOTE_DIR="www/pic-saint-loup"
          [[ "$REMOTE_DIR" == "www/pic-saint-loup" ]]

      - name: Reconnaître la clé SSH de l'hébergement OVH
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_HOST_FINGERPRINT: ${{ secrets.OVH_SFTP_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -p 22 "$OVH_SFTP_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if [[ -n "$OVH_SFTP_HOST_FINGERPRINT" ]]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$OVH_SFTP_HOST_FINGERPRINT" > /dev/null || {
              echo "::error::L'empreinte SSH OVH ne correspond pas à celle attendue."
              exit 1
            }
          else
            echo "::warning::Clé SSH OVH découverte au déploiement ; épingler l'empreinte avec OVH_SFTP_HOST_FINGERPRINT pour une vérification renforcée."
          fi

      - name: Publier uniquement www/pic-saint-loup/
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          PUBLISH_DIR="$GITHUB_WORKSPACE/www/pic-saint-loup"
          test -f "$PUBLISH_DIR/index.html"
          # Le heredoc évite les échappements imbriqués qui corrompaient le chemin local.
          # Ne supprimer aucun fichier distant et ne publier que ce sous-dossier.
          lftp -u "$OVH_SFTP_USER,$OVH_SFTP_PASSWORD" "sftp://$OVH_SFTP_HOST" <<LFTP
          set net:max-retries 2
          set net:timeout 30
          mkdir -p www/pic-saint-loup
          mirror --reverse --verbose=1 --parallel=2 --no-perms "$PUBLISH_DIR/" "www/pic-saint-loup/"
          bye
          LFTP
